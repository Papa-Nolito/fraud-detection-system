{% extends "base.html" %}
{% block content %}
<h1>User management</h1>
<div class="grid two">
  <div class="card scroll">
    <table>
      <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr>
      {% for u in users %}
      <tr><td>{{ u.full_name }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td>
        <td><span class="badge {{ 'low' if u.is_active else 'high' }}">{{ 'active' if u.is_active else 'disabled' }}</span></td>
        <td>{% if u.id != current_user.id %}
          <form method="post" class="inline">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="action" value="toggle"><input type="hidden" name="user_id" value="{{ u.id }}">
            <button class="btn small ghost">{{ 'Disable' if u.is_active else 'Enable' }}</button></form>{% endif %}</td></tr>
      {% endfor %}
    </table>
  </div>
  <div class="card">
    <h2>Add user</h2>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="action" value="create">
      <label>Full name <input name="full_name" required></label>
      <label>Email <input type="email" name="email" required></label>
      <label>Password (min 8 chars) <input type="password" name="password" minlength="8" required></label>
      <label>Role <select name="role"><option value="analyst">Fraud analyst</option><option value="admin">Administrator</option></select></label>
      <button class="btn">Create user</button>
    </form>
  </div>
</div>
{% endblock %}
